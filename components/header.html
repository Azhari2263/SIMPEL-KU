<!-- ==============================================================
     SIMPEL-KU - HEADER COMPONENT
     ============================================================== -->
<header class="h-16 glass-header border-b border-slate-200/80 px-4 sm:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-20 shadow-2xs">
  <div class="flex items-center space-x-3 min-w-0">
    <!-- Tombol Hamburger Mobile -->
    <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900 active:scale-95 transition cursor-pointer">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>
    <!-- Brand on Mobile -->
    <div class="md:hidden flex items-center gap-1.5 flex-shrink-0">
      <div class="w-7 h-7 rounded-lg app-logo-gradient flex items-center justify-center text-white text-xs shadow-xs">
        <i class="fa-solid fa-clipboard-check"></i>
      </div>
    </div>
    <!-- Title on Desktop & Mobile -->
    <div class="min-w-0 truncate">
      <h2 class="text-xs sm:text-sm md:text-base font-bold text-slate-900 tracking-tight truncate" id="topbarTitle">Dashboard Ringkasan</h2>
      <p class="hidden sm:block text-[11px] text-slate-500 font-medium truncate" id="topbarSubtitle">Ringkasan data checklist aktif</p>
    </div>
  </div>

  <div class="flex items-center space-x-2 sm:space-x-3 flex-shrink-0">
    <!-- Month/Year Pill Selector -->
    <div class="flex items-center bg-slate-100/90 hover:bg-slate-100 rounded-xl px-2.5 py-1 border border-slate-200/80 shadow-2xs text-xs transition">
      <i class="fa-solid fa-calendar-days text-blue-600 text-[11px] mr-1.5 flex-shrink-0"></i>
      <select id="globalMonthSelect" onchange="onGlobalDateChange()" class="bg-transparent font-bold text-slate-700 focus:outline-none cursor-pointer pr-1 text-xs">
        <option value="1">Januari</option>
        <option value="2">Februari</option>
        <option value="3">Maret</option>
        <option value="4">April</option>
        <option value="5">Mei</option>
        <option value="6">Juni</option>
        <option value="7">Juli</option>
        <option value="8">Agustus</option>
        <option value="9">September</option>
        <option value="10">Oktober</option>
        <option value="11">November</option>
        <option value="12">Desember</option>
      </select>
      <span class="text-slate-300 mx-1">/</span>
      <select id="globalYearSelect" onchange="onGlobalDateChange()" class="bg-transparent font-bold text-slate-700 focus:outline-none cursor-pointer text-xs">
        <option value="2025">2025</option>
        <option value="2026">2026</option>
        <option value="2027">2027</option>
      </select>
    </div>

    <!-- Refresh Button -->
    <button onclick="refreshCurrentPage()" title="Segarkan Data Realtime" class="w-9 h-9 rounded-xl bg-slate-100/90 hover:bg-blue-50 text-slate-600 hover:text-blue-600 border border-slate-200/80 transition-all flex items-center justify-center cursor-pointer shadow-2xs active:rotate-180 duration-300">
      <i class="fa-solid fa-arrows-rotate text-xs"></i>
    </button>
  </div>
</header>
