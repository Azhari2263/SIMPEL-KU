<!-- ==============================================================
     SIMPEL-KU - HEADER COMPONENT
     ============================================================== -->
<header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center space-x-3">
          <!-- Tombol Hamburger Mobile -->
          <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <div>
            <h2 class="text-sm sm:text-base font-bold text-slate-800" id="topbarTitle">Dashboard Ringkasan</h2>
            <p class="text-[11px] text-slate-400 font-medium hidden sm:block" id="topbarSubtitle">Ringkasan data checklist aktif</p>
          </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3">
          <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200 text-xs">
            <select id="globalMonthSelect" onchange="onGlobalDateChange()" class="bg-transparent font-semibold text-slate-700 focus:outline-none px-2 py-1 cursor-pointer">
              <option value="1">Januari</option>
              <option value="2">Februari</option>
              <option value="3">Maret</option>
              <option value="4">April</option>
              <option value="5">Mei</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">Agustus</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
            <select id="globalYearSelect" onchange="onGlobalDateChange()" class="bg-transparent font-semibold text-slate-700 focus:outline-none px-2 py-1 border-l border-slate-200 cursor-pointer">
              <option value="2025">2025</option>
              <option value="2026">2026</option>
              <option value="2027">2027</option>
            </select>
          </div>

          <button onclick="refreshCurrentPage()" title="Segarkan Data" class="p-2 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-600 text-slate-600 text-xs font-semibold transition-colors">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </header>
