<!-- ==============================================================
     SIMPEL-KU - LOGIN PAGE
     ============================================================== -->
<section id="loginPage" class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-gradient-to-br from-slate-100 via-blue-50/50 to-indigo-50/40">
  <!-- Ambient background glow elements -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-4xl h-96 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 my-auto">
    <!-- Header: Logo & Branding -->
    <div class="text-center mb-6">
      <div class="flex items-center justify-center mb-3.5">
        <!-- Logo Khusus SIMPEL-KU -->
        <img src="img/logo_simpelku.png" alt="Logo SIMPEL-KU" class="h-20 sm:h-24 w-auto object-contain drop-shadow-md transition-transform hover:scale-105 duration-200">
      </div>

      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 border border-blue-200/70 text-[10px] font-bold text-blue-700 tracking-wider uppercase mb-1.5 shadow-2xs">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
        <span>BPS Provinsi Kalimantan Barat</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">SIMPEL-KU</h1>
      <p class="text-xs sm:text-sm font-medium text-slate-500 mt-1 max-w-sm mx-auto leading-relaxed">
        Sistem Monitoring Pelayanan, Keamanan, dan Kebersihan Umum
      </p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-200/80 p-6 sm:p-8 transition-all">
      <div class="mb-5">
        <h2 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Masuk ke Akun</h2>
        <p class="text-xs text-slate-500 mt-0.5">Gunakan kredensial yang terdaftar pada sistem</p>
      </div>

      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-user text-xs"></i>
            </span>
            <input type="text" id="loginUsername" required placeholder="Contoh: slamet, rania, atau eddy" 
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200/90 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-600 focus:bg-white transition-all text-slate-800 font-medium placeholder-slate-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input type="password" id="loginPassword" required placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200/90 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-600 focus:bg-white transition-all text-slate-800 font-medium placeholder-slate-400">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer">
              <i id="eyeIcon" class="fa-solid fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <div id="loginErrorMessage" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-200 p-3 rounded-xl flex items-center space-x-2">
          <i class="fa-solid fa-triangle-exclamation flex-shrink-0"></i>
          <span id="loginErrorText">Kredensial tidak valid.</span>
        </div>

        <button type="submit" id="btnLoginSubmit"
          class="w-full py-3 px-4 bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-600 hover:from-blue-800 hover:to-indigo-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-lg shadow-blue-600/25 transition-all duration-200 flex items-center justify-center gap-2 transform active:scale-98 cursor-pointer">
          <span class="text-white font-bold">Masuk ke Dashboard</span>
          <i class="fa-solid fa-arrow-right text-xs text-white"></i>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
        <span class="flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved text-emerald-600"></i>
          <span>Sesi terenkripsi</span>
        </span>
        <span class="font-semibold text-slate-400">SIMPEL-KU v3.0</span>
      </div>
    </div>
  </div>
</section>
