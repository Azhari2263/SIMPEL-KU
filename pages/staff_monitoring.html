     ============================================================== -->
<section id="view-monitoring" class="hidden space-y-4">
          <!-- Header Card & Pilihan Periode (Harian [Default], Mingguan, Bulanan) -->
          <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2" id="monitoringSectionTitle">
                  <i class="fa-solid fa-sparkles text-accent-500"></i>
                  <span>Monitoring Kebersihan Umum</span>
                </h3>
                <p class="text-xs text-slate-500 mt-0.5" id="monitoringSubtitle">
                  Tandai cell merah menjadi selesai. Hari ini dapat dibatalkan jika salah klik.
                </p>
              </div>

              <!-- Segmented Switcher Periode: Harian (Default), Mingguan, Bulanan -->
              <div class="bg-slate-100 p-1 rounded-xl border border-slate-200/80 flex items-center text-xs font-semibold self-start sm:self-auto">
                <button onclick="changeMonitoringPeriod('harian')" id="periodBtn-harian" class="period-tab px-3.5 py-1.5 rounded-lg active">
                  <i class="fa-solid fa-calendar-day mr-1 text-[11px]"></i>Harian
                </button>
                <button onclick="changeMonitoringPeriod('mingguan')" id="periodBtn-mingguan" class="period-tab px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900">
                  <i class="fa-solid fa-calendar-week mr-1 text-[11px]"></i>Mingguan
                </button>
                <button onclick="changeMonitoringPeriod('bulanan')" id="periodBtn-bulanan" class="period-tab px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900">
                  <i class="fa-solid fa-calendar-days mr-1 text-[11px]"></i>Bulanan
                </button>
              </div>
            </div>

            <!-- Sub-Nav Panel (Slider Tanggal Harian / Filter Minggu) -->
            <div id="periodSubNavContainer" class="pt-3 border-t border-slate-100 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <!-- Content diinjeksi via renderPeriodSubNav() -->
            </div>

            <!-- Filter Bar: Ruangan, Status, Search -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-3 border-t border-slate-100">
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Filter Ruangan</label>
                <select id="filterRuangan" onchange="renderMonitoringView()" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                  <option value="SEMUA">Semua Ruangan</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Filter Status</label>
                <select id="filterStatus" onchange="renderMonitoringView()" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                  <option value="SEMUA">Semua Item Checkbox</option>
                  <option value="BELUM">Belum Dicentang (Kotak Merah)</option>
                  <option value="SELESAI">Sudah Dicentang (TRUE)</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Pencarian Kegiatan</label>
                <div class="relative">
                  <input type="text" id="searchKegiatan" oninput="renderMonitoringView()" placeholder="Cari kegiatan atau ruangan..." 
                    class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl pl-8 pr-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                  <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Container Utama Monitoring (Card List / Paged Full Screen Table) -->
          <div id="monitoringContentArea">
            <!-- Diisi via renderMonitoringView() -->
          </div>
        </section>

        <!-- ================= VIEW 3: REKAP MONITORING ================= -->
